    how_to_use: >-
      Observed 2026-09-15: golang Atom parsed via curl with a full Chrome user agent;
      devops Atom returned 403 with a shorter browser user agent. Web open failed
      for golang. These are method-specific observations, not permanent rules.
      Prior attempts at JSON and old.reddit.com were blocked.
    rate_limit: >-
      Reddit rate-limits hard. Requests about three seconds apart returned 429
      after the first one. Requests twenty-five seconds apart, with a retry
      after thirty seconds on a 429, succeeded for every subreddit tested.
      Budget roughly thirty seconds per subreddit and check only a handful.
    limitation: >-
      The feed carries titles, permalinks, timestamps and the outbound link for
      link posts, but it does NOT carry scores or comment counts. Reddit is
      therefore usable for discovery only. Any points or comment figure must be
      read from the post page itself and cited with its observation date.

